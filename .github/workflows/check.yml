name: Ledger checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check ledger.js
          node --check ledger-standalone.js
          node --check runtime-storage.js

      - name: Test ledger settlement
        run: node tests/ledger-settlement.cjs
