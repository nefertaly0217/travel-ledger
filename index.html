<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbf9">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>旅行记账</title>
  <link rel="stylesheet" href="./styles.css?v=20260922">
  <link rel="stylesheet" href="./ledger.css?v=20260922">
  <script src="./runtime-storage.js?v=20260922" defer></script>
  <script src="./ledger.js?v=cloud1" defer></script>
  <script src="./ledger-cloud.js?v=cloud1" defer></script>
</head>
<body data-active-view="ledger">
  <main class="ledger-view" id="ledger-view">
<section id="sync-panel" style="margin:12px 20px;padding:16px;border:1px solid #d8e0d8;border-radius:14px;background:#f3f7f1">
<strong>多设备共享账本</strong><p id="sync-status" role="status">正在加载…</p>
<div id="sync-local"><button id="sync-create" type="button">电脑：上传已有账单并创建共享账本</button>
<p><label for="sync-input">手机：粘贴电脑上的连接码</label><br><input id="sync-input" type="password" autocomplete="off" placeholder="64 位共享连接码" style="width:min(100%,400px)"><button id="sync-connect" type="button">连接共享账本</button></p></div>
<div id="sync-connected" hidden><button id="sync-reload" type="button">读取云端最新</button><details><summary>连接其他设备 / 管理连接</summary><p>持有连接码的人可以查看和修改账单，请私下传递并妥善保存。</p><input id="sync-code" readonly type="password" aria-label="共享连接码" style="width:min(100%,400px)"><button id="sync-copy" type="button">复制连接码</button><button id="sync-disconnect" type="button">断开本设备连接</button></details><small>保存成功后会显示“已同步到云端”。页面空闲时约每 8 秒读取其他设备的修改；正在填写时保留当前输入。</small></div>
</section>
    <p style="padding:12px 20px;margin:0"><a href="./ledger-migrate.html" style="color:#315d49">迁移旧账本的账单 →</a></p>
    <div
      id="ledger-root"
      data-trip-id="italy-2026-10"
      data-ledger-persistence="local"
      aria-live="polite"></div>
  </main>
</body>
</html>
